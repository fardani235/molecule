---
name: security
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *" # nightly drift monitoring
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    if: github.repository == 'fardani235/molecule'
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits

      # Report pass: never fails the build, always produces SARIF.
      - name: Gitleaks (report)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          args: >-
            detect --source=. --redact --no-git=false
            --report-format=sarif --report-path=gitleaks-report.sarif
            --exit-code=0

      - name: Upload Gitleaks SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

      - name: Upload Gitleaks report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      # Gate pass: any leak fails the job.
      - name: Gitleaks (gate)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: >-
            detect --source=. --redact --no-git=false --exit-code=1
